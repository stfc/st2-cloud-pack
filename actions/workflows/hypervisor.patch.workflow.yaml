version: 1.0

description: A sequential workflow to patch a Hypervisor.

input:
  - hypervisor_hostname
  - cloud_account

tasks:
  is_ready_to_patch:
    action: core.ask
    input:
      schema:
        type: object
        properties:
          next_action:
            type: string
            description: "Select next action"
            enum:
              - patch
              - reinstall
              - cancel
            required: True
    next:
      - when: <% task(is_ready_to_patch).result.response.next_action = patch %>
        do: patch_machine
      - when: <% task(is_ready_to_patch).result.response.next_action = reinstall %>
        do: stop_for_reinstall
      - when: <% task(is_ready_to_patch).result.response.next_action = cancel %>
        do: cancel

  stop_for_reinstall:
    action: core.echo message="Automatic patch of <% ctx().hypervisor_hostname %> stopped for reinstall."
    next:
      - do: fail

  cancel:
    action: core.echo message="Automatic patch of <% ctx().hypervisor_hostname %> cancelled by user."
    next:
      - do: fail

  patch_machine:
    action: stackstorm_openstack.hv.patch.reboot
    input:
      hypervisor_name: <% ctx().hypervisor_hostname %>
    next:
      - when: <% succeeded() %>
        do: wait_for_reboot

  wait_for_reboot:
    action: linux.wait_for_ssh
    delay: 90 # patch script on hv reboots after 60 secs
    input:
      hostname: <% ctx().hypervisor_hostname %>
      port: 22
      username: stackstorm
      keyfile: "/home/stanley/.ssh/id_rsa"
      timeout: 600 # 10 mins
      retries: 30
      sleep_delay: 20 # seconds
    next:
      - when: <% succeeded() %>
        do: test_and_enable_hypervisor

  test_and_enable_hypervisor:
    action: stackstorm_openstack.hv.post.reboot
    delay: 30 # Avoid race conditions when waiting for ssh
    input:
      cloud_account: <% ctx().cloud_account %>
      hypervisor_hostname: <% ctx().hypervisor_hostname %>
