---
name: detect_vms_affected_with_cves
pack: stackstorm_openstack
description: Run everyday at 10:30AM to detect new VMs that are affected by CVEs
enabled: true

trigger:
  type: core.st2.CronTimer
  parameters:
    timezone: "Europe/London"
    day_of_week: mon,tue,wed,thu,fri
    hour: 10
    minute: 30

# The hv.search.by.property is added for testing purposes
action:
  ref: stackstorm_openstack.hv.search.by.property
