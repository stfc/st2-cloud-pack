---
class_name: HypervisorStateSensor
entry_point: src/hypervisor_state_sensor.py
description: Monitors Hypervisors
poll_interval: 600
enabled: false
trigger_types:
  - name: "hypervisor.state_change"
    description: "Triggers when there is an action to take on the hypervisor"
    payload_schema:
      type: "object"
      properties:
        hypervisor_name:
          type: "string"
          description: "Hypervisor Name"
        action:
          type: "string"
          description: "Action to take on the hypervisor"
        cloud_account:
          type: "string"
          description: "Name of cloud account for running this sensor and actions"
